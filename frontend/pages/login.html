<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — Login — BPES</title>
</head>
<body>

<div id="screen-login" class="figma-split-container">
  
  <!-- Left: 710px Campus Panel  -->
  <div class="figma-campus-panel">
    <div class="figma-campus-header">
      <div class="figma-brand-logo">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <div class="figma-brand-text">Bagoong Pook Elementary School</div>
    </div>

    <div class="figma-campus-copy">
      <h2>Welcome to BPES Portal</h2>
      <p>Access classroom attendance and school records in one place.</p>
    </div>
  </div>

  <!-- Right: Form Panel with Exact Login Card -->
  <div class="figma-form-panel">
    
    <!-- Top Bar with Back Button -->
    <div class="figma-auth-topbar">
      <div class="d-flex align-items-center gap-2 d-lg-none">
        <div class="bpes-logo-icon" style="background: var(--color-primary-light); color: var(--color-primary);">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <span class="fw-bold" style="font-family: var(--font-brand); font-size: 20px; color: var(--color-primary);">BPES Portal</span>
      </div>

      <button class="figma-auth-back-btn ms-auto" onclick="loadPage('welcome')" title="Return to the welcome page">
        <i class="fas fa-arrow-left"></i>
        <span>Back</span>
      </button>
    </div>

    <!-- Center Card -->
    <div class="figma-card-wrapper">
      <div class="figma-auth-card">
        
        <div class="card-header border-0 bg-transparent p-0 mb-4">
          <h1 class="figma-auth-card-title">Sign in</h1>
          <p class="figma-auth-card-subtitle mb-0">Use your school account to continue.</p>
        </div>

        <div id="login-alert-box"></div>

        <form id="unified-login-form" onsubmit="handleUnifiedLogin(event)">
          
          <div class="bpes-form-group">
            <label for="login-username" class="bpes-label">LRN/Email</label>
            <div class="bpes-input-wrapper">
              <i class="fas fa-user bpes-input-icon"></i>
              <input type="text" id="login-username" class="bpes-input with-icon" placeholder="Student: LRN / Teacher: email" required autocomplete="username">
            </div>
          </div>

          <div class="bpes-form-group">
            <label for="login-password" class="bpes-label">Password</label>
            <div class="bpes-input-wrapper">
              <i class="fas fa-lock bpes-input-icon"></i>
              <input type="password" id="login-password" class="bpes-input with-icon with-password-toggle" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="bpes-password-toggle-btn" onclick="togglePasswordVisibility('login-password', this)" aria-label="Toggle password visibility" tabindex="-1">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-end mb-4">
            <a href="#" class="small text-decoration-none" style="color: var(--color-text-secondary); font-size: 13px;" onclick="alert('Please contact the BPES school administrator to reset your credentials.'); return false;">
              Forgot Password?
            </a>
          </div>

          <button type="submit" id="unified-login-btn" class="bpes-btn-primary w-100 py-3" style="border-radius: var(--radius-input);">
            <span>Sign in</span>
          </button>
        </form>

        <div class="text-center mt-4 pt-2" style="font-size: 14px;">
          <span style="color: var(--color-text-secondary);">No account yet? Your account is created when the school administrator enrolls your RFID card.</span>
        </div>

      </div>
    </div>

  </div>

</div>

</body>
</html>
